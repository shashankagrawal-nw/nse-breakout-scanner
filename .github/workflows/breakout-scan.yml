name: NSE Breakout Scanner

on:
  schedule:
    - cron: '30 12 * * 1-5'   # 18:00 IST, Mon-Fri (cron is UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Claude Code (only if using subscription token)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Run scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Slack incoming webhook. Secret, never inline — the URL is a
          # bearer credential for posting to the channel.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Kite price alerts. Both absent -> alert sync is skipped silently.
          # KITE_ACCESS_TOKEN is flushed by Zerodha ~07:30 IST daily, so it
          # must be refreshed each morning: tools/kite_login.py --repo o/n
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: python run.py

      - name: Commit outputs
        run: |
          git config user.name "breakout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "scan $(date -u +%F)"
          git push
